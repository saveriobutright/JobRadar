spring.application.name=job-radar
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jobradar}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:jobradar}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:jobradar}

jobradar.ingestion.schedule.enabled=false
jobradar.ingestion.schedule.page=1
jobradar.ingestion.schedule.fixed-delay=PT1H
jobradar.ingestion.schedule.initial-delay=PT30S
jobradar.scoring.target-roles=Data Engineer,Analytics Engineer,Machine Learning Engineer,AI Engineer
jobradar.scoring.skills=SQL,Python,Java,Spring Boot,PostgreSQL,Docker,Apache Kafka,Apache Spark,Apache Airflow,AWS,Machine Learning
jobradar.scoring.preferred-job-types=Full-time
jobradar.scoring.remote-preferred=true
