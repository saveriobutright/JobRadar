name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify with Maven Wrapper
        run: ./mvnw --batch-mode verify

  container:
    name: Build and smoke test container
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Start application stack
        run: docker compose up --build --detach --wait --wait-timeout 180

      - name: Verify dashboard response
        run: curl --fail --silent --show-error http://localhost:8080/ > /dev/null

      - name: Show container logs after failure
        if: failure()
        run: docker compose logs

      - name: Stop application stack
        if: always()
        run: docker compose down --volumes

      - name: Verify non-root runtime
        run: |
          docker compose exec -T app sh -c 'test "$(id -u)" -ne 0'
